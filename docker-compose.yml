services:
  # 统一网关 - 实现同域部署，共享 localStorage
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    container_name: bookstore-gateway
    depends_on:
      - frontend-user
      - frontend-admin
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 用户端 - 购书商城
  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    restart: unless-stopped
    container_name: bookstore-user
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 管理后台
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    restart: unless-stopped
    container_name: bookstore-admin
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
